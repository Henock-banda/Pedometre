<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podomètre - Mesure de Distance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    color: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 1.6em; margin-bottom: 20px; text-align: center; }
  .card {
    background: rgba(255,255,255,0.15);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 25px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 15px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .steps-display { text-align: center; padding: 20px 0; }
  .steps-number {
    font-size: 4em;
    font-weight: bold;
    line-height: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }
  .steps-label { font-size: 1em; opacity: 0.9; margin-top: 5px; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 15px;
  }
  .stat-box {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 12px;
    text-align: center;
  }
  .stat-value { font-size: 1.5em; font-weight: bold; }
  .stat-label { font-size: 0.8em; opacity: 0.8; margin-top: 3px; }
  .controls { display: flex; gap: 10px; margin-top: 5px; }
  button {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    color: #fff;
  }
  button:active { transform: scale(0.96); }
  .btn-start { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .btn-stop { background: linear-gradient(135deg, #eb3349, #f45c43); }
  .btn-reset { background: rgba(255,255,255,0.2); }
  .btn-step {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    padding: 20px;
    font-size: 1.1em;
  }
  .settings label {
    display: block;
    font-size: 0.9em;
    margin-bottom: 5px;
    opacity: 0.9;
  }
  .settings input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 1em;
  }
  .settings input::placeholder { color: rgba(255,255,255,0.6); }
  .status {
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.9em;
    margin-top: 10px;
    background: rgba(0,0,0,0.2);
  }
  .status.active { background: rgba(56, 239, 125, 0.3); }
  .mode-toggle {
    display: flex;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 15px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px;
    background: transparent;
    color: rgba(255,255,255,0.7);
    border-radius: 8px;
    font-size: 0.9em;
  }
  .mode-btn.active { background: rgba(255,255,255,0.25); color: #fff; }
  .app-footer {
    margin-top: auto;
    padding: 15px 10px 5px;
    text-align: center;
    font-size: 0.8em;
    opacity: 0.85;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>👟 Podomètre</h1>

<div class="card">
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="auto">Mode Auto</button>
    <button class="mode-btn" data-mode="manual">Mode Manuel</button>
  </div>

  <div class="steps-display">
    <div class="steps-number" id="stepsCount">0</div>
    <div class="steps-label">pas</div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="distance">0.00</div>
      <div class="stat-label">mètres</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="distanceKm">0.000</div>
      <div class="stat-label">km</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="calories">0</div>
      <div class="stat-label">calories</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="time">00:00</div>
      <div class="stat-label">durée</div>
    </div>
  </div>
</div>

<div class="card settings">
  <label for="strideLength">Longueur de foulée (cm) — auto si vide</label>
  <input type="number" id="strideLength" placeholder="Ex : 72" min="30" max="150" inputmode="numeric">
  <label for="height" style="margin-top:10px;">Votre taille (cm) — pour calculer la foulée</label>
  <input type="number" id="height" placeholder="Ex : 175" min="100" max="220" inputmode="numeric">
</div>

<div class="card">
  <div class="controls">
    <button class="btn-start" id="startBtn">▶ Démarrer</button>
    <button class="btn-reset" id="resetBtn">↺ Reset</button>
  </div>
  <div class="status" id="status">En attente...</div>
  <button class="btn-step" id="stepBtn" style="display:none; margin-top:10px; width:100%;">
    👣 Compter un pas
  </button>
</div>

<footer class="app-footer">
  Application développée par <strong>Les Jeunes Courageux</strong><br>
  Version 5
</footer>

<script>
let steps = 0;
let elapsedMs = 0;          // temps cumulé (conservé pendant les pauses)
let segmentStart = null;    // début du segment en cours
let timerInterval = null;
let isRunning = false;
let mode = 'auto';
let lastStepTime = 0;
let wakeLock = null;

// Variables du filtre de détection des pas
let smooth = null;          // signal lissé
let baseline = null;        // gravité estimée (composante lente)
let armed = true;           // évite de compter plusieurs fois le même pic
const STEP_THRESHOLD = 1.2; // m/s² — sensibilité (baisser = plus sensible)
const MIN_STEP_INTERVAL = 300; // ms entre deux pas

const stepsCountEl = document.getElementById('stepsCount');
const distanceEl = document.getElementById('distance');
const distanceKmEl = document.getElementById('distanceKm');
const caloriesEl = document.getElementById('calories');
const timeEl = document.getElementById('time');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const stepBtn = document.getElementById('stepBtn');
const statusEl = document.getElementById('status');
const strideInput = document.getElementById('strideLength');
const heightInput = document.getElementById('height');

// Sauvegarde / chargement des réglages
function saveSettings() {
  try {
    localStorage.setItem('pedo_stride', strideInput.value);
    localStorage.setItem('pedo_height', heightInput.value);
  } catch (e) {}
}
function loadSettings() {
  try {
    strideInput.value = localStorage.getItem('pedo_stride') || '';
    heightInput.value = localStorage.getItem('pedo_height') || '';
  } catch (e) {}
}

// Longueur de foulée (cm)
function getStrideLength() {
  const custom = parseFloat(strideInput.value);
  if (custom > 0) return custom;
  const height = parseFloat(heightInput.value);
  if (height > 0) return Math.round(height * 0.413); // foulée ≈ taille × 0,413
  return 72; // valeur par défaut
}

function updateDisplay() {
  stepsCountEl.textContent = steps;
  const distanceM = steps * (getStrideLength() / 100);
  distanceEl.textContent = distanceM.toFixed(2);
  distanceKmEl.textContent = (distanceM / 1000).toFixed(3);
  caloriesEl.textContent = Math.round(steps * 0.04); // estimation moyenne
}

function bump() {
  stepsCountEl.style.transform = 'scale(1.1)';
  setTimeout(() => { stepsCountEl.style.transform = 'scale(1)'; }, 100);
}

function addStep() {
  steps++;
  updateDisplay();
  bump();
}

// Détection d'un pas via l'accéléromètre
function handleMotion(event) {
  if (!isRunning || mode !== 'auto') return;
  const acc = event.accelerationIncludingGravity;
  if (!acc || acc.x == null) return;

  const magnitude = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);

  // Initialisation des filtres
  if (smooth === null) { smooth = magnitude; baseline = magnitude; return; }

  smooth = smooth * 0.7 + magnitude * 0.3;       // lissage du bruit
  baseline = baseline * 0.98 + magnitude * 0.02; // gravité (variation lente)
  const dynamic = smooth - baseline;             // mouvement réel

  const now = Date.now();
  if (armed && dynamic > STEP_THRESHOLD && (now - lastStepTime) > MIN_STEP_INTERVAL) {
    lastStepTime = now;
    armed = false;
    addStep();
  } else if (!armed && dynamic < STEP_THRESHOLD * 0.4) {
    armed = true; // prêt pour le pas suivant
  }
}

// Chronomètre (conserve le temps après une pause)
function getElapsedSeconds() {
  const current = segmentStart ? Date.now() - segmentStart : 0;
  return Math.floor((elapsedMs + current) / 1000);
}
function updateTimer() {
  const total = getElapsedSeconds();
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60).toString().padStart(2, '0');
  const s = (total % 60).toString().padStart(2, '0');
  timeEl.textContent = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
}

// Permission capteurs (iOS 13+)
async function requestMotionPermission() {
  if (typeof DeviceMotionEvent === 'undefined') return false;
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      return (await DeviceMotionEvent.requestPermission()) === 'granted';
    } catch (e) {
      return false;
    }
  }
  return true; // Android : pas de demande nécessaire
}

// Garde l'écran allumé pendant la marche (si supporté)
async function lockScreen() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}
function unlockScreen() {
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isRunning) lockScreen();
});

// Active la détection selon le mode ; retourne false si impossible
async function applyMode() {
  window.removeEventListener('devicemotion', handleMotion);
  if (mode === 'auto') {
    const granted = await requestMotionPermission();
    if (!granted) {
      statusEl.textContent = '❌ Capteur indisponible ou permission refusée. Utilisez le mode manuel.';
      statusEl.classList.remove('active');
      return false;
    }
    smooth = null; baseline = null; armed = true;
    window.addEventListener('devicemotion', handleMotion);
    stepBtn.style.display = 'none';
    statusEl.textContent = '🏃 Marche détectée automatiquement';
  } else {
    stepBtn.style.display = 'block';
    statusEl.textContent = '👆 Appuyez sur le bouton à chaque pas';
  }
  statusEl.classList.add('active');
  return true;
}

function setButtonRunning(running) {
  startBtn.classList.toggle('btn-stop', running);
  startBtn.classList.toggle('btn-start', !running);
}

// Démarrer / Pause
startBtn.addEventListener('click', async () => {
  if (!isRunning) {
    const ok = await applyMode();
    if (!ok) return;
    segmentStart = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    isRunning = true;
    startBtn.textContent = '⏸ Pause';
    setButtonRunning(true);
    lockScreen();
  } else {
    window.removeEventListener('devicemotion', handleMotion);
    clearInterval(timerInterval);
    elapsedMs += Date.now() - segmentStart;
    segmentStart = null;
    isRunning = false;
    stepBtn.style.display = 'none';
    statusEl.textContent = '⏸ En pause';
    statusEl.classList.remove('active');
    startBtn.textContent = '▶ Reprendre';
    setButtonRunning(false);
    unlockScreen();
    updateTimer();
  }
});

// Reset
resetBtn.addEventListener('click', () => {
  if (!confirm('Remettre le compteur à zéro ?')) return;
  steps = 0;
  elapsedMs = 0;
  segmentStart = null;
  clearInterval(timerInterval);
  isRunning = false;
  window.removeEventListener('devicemotion', handleMotion);
  unlockScreen();
  stepBtn.style.display = 'none';
  timeEl.textContent = '00:00';
  statusEl.textContent = 'En attente...';
  statusEl.classList.remove('active');
  startBtn.textContent = '▶ Démarrer';
  setButtonRunning(false);
  updateDisplay();
});

// Bouton « compter un pas » (mode manuel)
stepBtn.addEventListener('click', addStep);

// Changement de mode
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const newMode = btn.dataset.mode;
    if (newMode === mode) return;
    const oldMode = mode;
    mode = newMode;
    if (isRunning) {
      const ok = await applyMode();
      if (!ok) { // retour au mode précédent si le capteur n'est pas disponible
        mode = oldMode;
        await applyMode();
        return;
      }
    }
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Mise à jour quand on change la foulée ou la taille
strideInput.addEventListener('input', () => { saveSettings(); updateDisplay(); });
heightInput.addEventListener('input', () => { saveSettings(); updateDisplay(); });

loadSettings();
updateDisplay();
</script>

</body>
</html>
