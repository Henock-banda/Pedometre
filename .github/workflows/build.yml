name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer le projet
        run: |
          mkdir www
          cp index.html manifest.json www/
          cp ic*-192.png www/icon-192.png
          cp ic*-512.png www/icon-512.png
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Podomètre" "com.jeunescourageux.podometre" --web-dir=www
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: podometre-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
